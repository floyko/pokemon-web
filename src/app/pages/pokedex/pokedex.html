<div class="flex flex-col justify-between items-center min-h-screen w-screen p-6">
  <div class="flex flex-col gap-4 w-full">
    <div class="grid grid-cols-2 gap-4 md:grid-cols-4 lg:grid-cols-5">
      @for (pokemon of paginatedPokemon; track pokemon.id) {
      <app-card [pokemon]="pokemon"></app-card>
      }
    </div>
  </div>
  <div class="join grid grid-cols-3 my-4">
    <button class="join-item btn" [disabled]="currentPage === 1" (click)="previousPage()">Previous</button>
    <button class="join-item btn btn-disabled">Page {{ this.currentPage }} of {{
      this.totalPages
      }}</button>
    <button class="join-item btn" [disabled]="currentPage === totalPages" (click)="nextPage()">Next</button>
  </div>
</div>
